spring.application.name=GrievanceTracker

# Database setup
spring.datasource.url=jdbc:h2:mem:grievancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa

# 🔒 SECURITY: Your new secret database password
spring.datasource.password=MySecretPassword

# Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console
spring.h2.console.enabled=true

# 🔒 SECURITY: Your new secret web address door
spring.h2.console.path=/my-secret-h2-door

# 🔓 RENDER FIX: Unlocks the door so you can access it over the internet
spring.h2.console.settings.web-allow-others=true