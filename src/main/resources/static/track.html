<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Grievances</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; padding: 20px; margin: 0;}
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        .back-link { color: #007bff; text-decoration: none; font-weight: bold; margin-bottom: 15px; display: inline-block;}
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; position: relative;}
        .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #ffc107; color: black; display: inline-block; margin-top: 5px;}
        .date { font-size: 12px; color: #888; }
        .del-btn { position: absolute; right: 15px; top: 15px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <a href="/home.html" class="back-link">← Back to Home</a>
    <h2>My Filed Grievances</h2>
    <div id="list"></div>
</div>
<script>
    const user = localStorage.getItem("currentUser");
    if (!user) window.location.href = "/";

    function load() {
        fetch(`/api/grievances/user/${user}`).then(res => res.json()).then(data => {
            const list = document.getElementById("list");
            list.innerHTML = "";
            if(data.length === 0) list.innerHTML = "<p>No grievances filed yet.</p>";

            data.forEach(g => {
                // Format the date beautifully
                const dateStr = new Date(g.submissionDate).toLocaleString();
                list.innerHTML += `
                        <div class="card">
                            <button class="del-btn" onclick="deleteG(${g.id})">Delete</button>
                            <h3 style="margin:0 0 5px 0;">${g.title}</h3>
                            <div class="date">📅 ${dateStr}</div>
                            <p style="margin:10px 0;">${g.description}</p>
                            <div class="status">STATUS: ${g.status}</div>
                        </div>
                    `;
            });
        });
    }

    function deleteG(id) {
        if(confirm("Are you sure you want to delete this?")) {
            fetch(`/api/grievances/${id}`, { method: 'DELETE' }).then(() => load());
        }
    }
    load();
</script>
</body>
</html>
