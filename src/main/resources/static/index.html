<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button:hover { background: #004494; }
        .toggle-text { margin-top: 15px; font-size: 13px; color: #555; cursor: pointer; text-decoration: underline; }

        /* New Canvas Captcha Styles */
        .captcha-box { background: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #ccc; display: flex; flex-direction: column; align-items: center; }
        .captcha-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; width: 100%; }
        canvas { border: 1px solid #aaa; border-radius: 4px; background: white; }
        .refresh-btn { width: auto; padding: 8px 12px; margin: 0; background: #6c757d; font-size: 16px; }
        .refresh-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<form class="card" id="loginBox" onsubmit="event.preventDefault(); login();">
    <h2>Welcome Back</h2>
    <input type="text" id="loginUser" placeholder="Username" required>
    <input type="password" id="loginPass" placeholder="Password" required>

    <!-- Upgraded Distorted Captcha Box -->
    <div class="captcha-box">
        <div class="captcha-row">
            <canvas id="captchaCanvas" width="140" height="40"></canvas>
            <!-- type="button" stops the Enter key from clicking this button -->
            <button type="button" class="refresh-btn" onclick="generateCaptcha()" title="Refresh Captcha">↻</button>
        </div>
        <input type="text" id="loginCaptchaInput" placeholder="Enter the letters above" required autocomplete="off">
    </div>

    <button type="submit">Login</button>
    <div class="toggle-text" onclick="showScreen('signupBox')">Need an account? Sign Up</div>
    <div class="toggle-text" onclick="showScreen('forgotBox')">Forgot Password?</div>
</form>

<!-- 2. SIGNUP SCREEN -->
<form class="card" id="signupBox" style="display: none;" onsubmit="event.preventDefault(); signup();">
    <h2>Create Account</h2>
    <input type="text" id="signUser" placeholder="Choose a Username" required>
    <input type="password" id="signPass" placeholder="Choose a Password" required>

    <select id="signQuestion">
        <option value="Childhood best friend's name?">Childhood best friend's name?</option>
        <option value="What city were you born in?">What city were you born in?</option>
        <option value="What is your favorite color?">What is your favorite color?</option>
    </select>
    <input type="text" id="signAnswer" placeholder="Your Security Answer" required>

    <button type="submit" style="background: #28a745;">Sign Up</button>
    <div class="toggle-text" onclick="showScreen('loginBox')">Already have an account? Login</div>
</form>

<!-- 3. FORGOT PASSWORD SCREEN -->
<form class="card" id="forgotBox" style="display: none;" onsubmit="event.preventDefault(); resetPassword();">
    <h2>Reset Password</h2>
    <p style="font-size: 13px; color: gray;">Enter your username to reset.</p>
    <input type="text" id="resetUser" placeholder="Username" required>
    <input type="text" id="resetAnswer" placeholder="Your Security Answer" required>
    <input type="password" id="resetNewPass" placeholder="New Password" required>

    <button type="submit" style="background: #dc3545;">Reset Password</button>
    <div class="toggle-text" onclick="showScreen('loginBox')">Back to Login</div>
</form>

<script>
    // --- NEW IMAGE CAPTCHA LOGIC ---
    let captchaAnswer = "";

    function generateCaptcha() {
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');

        // Clear old canvas and fill with light gray background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f3f3f3";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Allowed characters (Removed O, 0, 1, I, l for easier reading)
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
        captchaAnswer = "";
        for (let i = 0; i < 6; i++) {
            captchaAnswer += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        // 1. Draw random messy background lines (Noise)
        for (let i = 0; i < 6; i++) {
            ctx.strokeStyle = getRandomColor();
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
        }

        // 2. Draw the distorted letters
        for (let i = 0; i < captchaAnswer.length; i++) {
            ctx.font = "bold " + (18 + Math.random() * 8) + "px Arial"; // Random font size
            ctx.fillStyle = getRandomColor(); // Random text color

            ctx.save();
            ctx.translate(15 + (i * 20), 25 + (Math.random() * 5)); // Random X and Y spacing
            ctx.rotate((Math.random() - 0.5) * 0.5); // Random tilt angle
            ctx.fillText(captchaAnswer[i], 0, 0);
            ctx.restore();
        }

        // Clear the user's input box
        document.getElementById('loginCaptchaInput').value = "";
    }

    function getRandomColor() {
        // Generates random dark colors so they stand out against the light background
        const r = Math.floor(Math.random() * 150);
        const g = Math.floor(Math.random() * 150);
        const b = Math.floor(Math.random() * 150);
        return `rgb(${r},${g},${b})`;
    }

    // --- NAVIGATION LOGIC ---
    function showScreen(screenId) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('signupBox').style.display = 'none';
        document.getElementById('forgotBox').style.display = 'none';
        document.getElementById(screenId).style.display = 'block';

        if (screenId === 'loginBox') generateCaptcha();
    }

    // --- API CALLS ---
    function signup() {
        const u = document.getElementById('signUser').value.trim();
        const p = document.getElementById('signPass').value;
        const q = document.getElementById('signQuestion').value;
        const a = document.getElementById('signAnswer').value.trim();

        if(!u || !p || !a) return alert("Please fill all fields!");

        const hasCapital = /[A-Z]/.test(p);
        const hasNumber = /[0-9]/.test(p);
        const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(p);

        if (!hasCapital || !hasNumber || !hasSymbol) {
            return alert("Weak Password! It must contain at least:\n- One Capital Letter\n- One Number\n- One Symbol (e.g. @, #, $)");
        }

        fetch('/api/users/signup', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p, securityQuestion: q, securityAnswer: a })
        }).then(async res => {
            const msg = await res.text();
            if(!res.ok) throw new Error(msg);
            return msg;
        }).then(msg => {
            alert("Account created successfully! Please log in.");
            document.getElementById('signUser').value = "";
            document.getElementById('signPass').value = "";
            document.getElementById('signAnswer').value = "";
            showScreen('loginBox');
        }).catch(err => alert(err.message));
    }

    function login() {
        // Verify new Image Captcha (case-insensitive for better user experience)
        const userInput = document.getElementById('loginCaptchaInput').value.trim().toLowerCase();
        if (userInput !== captchaAnswer.toLowerCase()) {
            alert("Incorrect Captcha! Please try the new image.");
            generateCaptcha();
            return;
        }

        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value;

        fetch('/api/users/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(async res => {
            if(!res.ok) {
                const errorMsg = await res.text();
                throw new Error(errorMsg);
            }
            return res.json();
        }).then(data => {
            localStorage.setItem("currentUser", data.username);
            localStorage.setItem("role", data.role);
            window.location.href = data.role === "ADMIN" ? "/admin.html" : "/home.html";
        }).catch(err => {
            alert(err.message);
            generateCaptcha();
        });
    }

    function resetPassword() {
        const u = document.getElementById('resetUser').value.trim();
        const a = document.getElementById('resetAnswer').value.trim();
        const np = document.getElementById('resetNewPass').value;

        if(!u || !a || !np) return alert("Please fill all fields!");

        const hasCapital = /[A-Z]/.test(np);
        const hasNumber = /[0-9]/.test(np);
        const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(np);

        if (!hasCapital || !hasNumber || !hasSymbol) {
            return alert("Weak Password! It must contain at least:\n- One Capital Letter\n- One Number\n- One Symbol (e.g. @, #, $)");
        }

        fetch('/api/users/reset-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, securityAnswer: a, password: np })
        }).then(async res => {
            const msg = await res.text();
            if(!res.ok) throw new Error(msg);
            return msg;
        }).then(msg => {
            alert("Success! You can now log in with your new password.");
            document.getElementById('resetUser').value = "";
            document.getElementById('resetAnswer').value = "";
            document.getElementById('resetNewPass').value = "";
            showScreen('loginBox');
        }).catch(err => alert(err.message));
    }

    // Generate the first distorted image on page load
    generateCaptcha();
</script>
</body>
</html>
