<!DOCTYPE html>
<html>
<head>
    <title>Grievance Portal</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>Login</h2>
    <p style="font-size: 13px; color: gray;">Type "Admin" for admin dashboard.<br>Type anything else for citizen dashboard.</p>
    <input type="text" id="usernameInput" placeholder="Enter your name">
    <button onclick="login()">Enter Portal</button>
</div>

<script>
    function login() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) return alert("Please enter a name");

        localStorage.setItem("currentUser", username);
        if (username.toLowerCase() === "admin") {
            window.location.href = "/admin.html";
        } else {
            window.location.href = "/citizen.html";
        }
    }
</script>
</body>
</html>
