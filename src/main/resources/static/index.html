<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;}
        button:hover { background: #004494; }
        .toggle-text { margin-top: 15px; font-size: 14px; color: #555; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
<div class="card" id="loginBox">
    <h2>Welcome Back</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="toggle-text" onclick="toggleView()">Need an account? Sign Up</div>
</div>

<div class="card" id="signupBox" style="display: none;">
    <h2>Create Account</h2>
    <input type="text" id="signUser" placeholder="Choose a Username">
    <input type="password" id="signPass" placeholder="Choose a Password">
    <button onclick="signup()" style="background: #28a745;">Sign Up</button>
    <div class="toggle-text" onclick="toggleView()">Already have an account? Login</div>
</div>

<script>
    function toggleView() {
        const loginBox = document.getElementById('loginBox');
        const signupBox = document.getElementById('signupBox');
        if (loginBox.style.display === 'none') {
            loginBox.style.display = 'block';
            signupBox.style.display = 'none';
        } else {
            loginBox.style.display = 'none';
            signupBox.style.display = 'block';
        }
    }

    function signup() {
        const u = document.getElementById('signUser').value;
        const p = document.getElementById('signPass').value;
        fetch('/api/users/signup', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(res => res.text()).then(msg => {
            alert(msg);
            if(msg.includes("successful")) toggleView();
        });
    }

    function login() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        fetch('/api/users/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(res => {
            if(!res.ok) throw new Error("Invalid credentials");
            return res.json();
        }).then(data => {
            localStorage.setItem("currentUser", data.username);
            localStorage.setItem("role", data.role);
            window.location.href = data.role === "ADMIN" ? "/admin.html" : "/home.html";
        }).catch(err => alert(err.message));
    }
</script>
</body>
</html>
