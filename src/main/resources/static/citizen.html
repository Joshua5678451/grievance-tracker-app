<!DOCTYPE html>
<html>
<head>
    <title>Citizen Dashboard</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }

        /* Added styling for the new history table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
        .status-badge { font-weight: bold; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h2 id="welcomeMsg">Welcome</h2>
    <button onclick="logout()" style="background: #dc3545; width: auto;">Logout</button>
    <hr>

    <!-- Form to submit a new issue -->
    <h3>File a New Grievance</h3>
    <input type="text" id="title" placeholder="Issue (e.g., Pothole)">
    <textarea id="description" placeholder="Describe the problem..." rows="4"></textarea>
    <button onclick="submitGrievance()">Submit Grievance</button>

    <hr>

    <!-- New section to show their past issues -->
    <h3>My Submitted Grievances</h3>
    <table>
        <thead>
        <tr>
            <th>Issue</th>
            <th>Description</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="myHistory">
        <!-- User's history will load here -->
        </tbody>
    </table>
</div>

<script>
    // 1. Verify User
    const user = localStorage.getItem("currentUser");
    if (!user || user.toLowerCase() === "admin") window.location.href = "/";
    document.getElementById("welcomeMsg").innerText = "Welcome, " + user;

    // 2. Submit new grievance
    function submitGrievance() {
        const title = document.getElementById("title").value;
        const desc = document.getElementById("description").value;

        if(!title || !desc) {
            alert("Please fill in both fields!");
            return;
        }

        fetch('/api/grievances', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ citizenName: user, title: title, description: desc })
        }).then(() => {
            alert("Grievance Submitted!");
            document.getElementById("title").value = "";
            document.getElementById("description").value = "";
            loadMyHistory(); // Automatically refresh the table!
        });
    }

    // 3. Load user's past grievances
    function loadMyHistory() {
        fetch(`/api/grievances/user/${user}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("myHistory");
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>You haven't submitted any grievances yet.</td></tr>";
                    return;
                }

                data.forEach(g => {
                    tbody.innerHTML += `
                            <tr>
                                <td><b>${g.title}</b></td>
                                <td>${g.description}</td>
                                <td><span class="status-badge">${g.status}</span></td>
                            </tr>
                        `;
                });
            });
    }

    // 4. Logout
    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "/";
    }

    // Run this function immediately when the page opens
    loadMyHistory();
</script>
</body>
</html>
