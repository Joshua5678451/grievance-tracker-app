<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; padding: 20px; margin:0;}
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #343a40; color: white; }
        .del-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .date { font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <button onclick="logout()" style="background:#dc3545; color:white; border:none; padding:10px; border-radius:5px; float:right; cursor:pointer;">Logout</button>
    <h2>Admin Authority Panel</h2>

    <table>
        <thead><tr>
            <th>Date & User</th>
            <th>Issue Details</th>
            <th>Status</th>
            <th>Actions</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    if (localStorage.getItem("role") !== "ADMIN") window.location.href = "/";

    function load() {
        fetch('/api/grievances').then(r => r.json()).then(data => {
            const tb = document.getElementById("tableBody");
            tb.innerHTML = "";
            data.forEach(g => {
                const dateStr = new Date(g.submissionDate).toLocaleString();
                tb.innerHTML += `
                        <tr>
                            <td><b>${g.citizenName}</b><br><span class="date">${dateStr}</span></td>
                            <td><b>${g.title}</b><br>${g.description}</td>
                            <td>
                                <select onchange="updateStatus(${g.id}, this.value)">
                                    <option value="${g.status}" hidden>${g.status}</option>
                                    <option value="OPEN">OPEN</option>
                                    <option value="SOLVING">SOLVING</option>
                                    <option value="SOLVED">SOLVED</option>
                                </select>
                            </td>
                            <td><button class="del-btn" onclick="deleteG(${g.id})">Delete</button></td>
                        </tr>`;
            });
        });
    }

    function updateStatus(id, stat) { fetch(`/api/grievances/${id}/status?status=${stat}`, { method: 'PUT' }).then(() => load()); }
    function deleteG(id) { if(confirm("Delete this record?")) fetch(`/api/grievances/${id}`, { method: 'DELETE' }).then(() => load()); }
    function logout() { localStorage.clear(); window.location.href = "/"; }

    load();
</script>
</body>
</html>
